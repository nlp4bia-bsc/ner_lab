[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab"
version = "0.1.0"
description = "NLP tooling for the unit: corpus contracts, splitting, statistics and span scoring in the base install; clinical NER and entity linking as extras."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0",
    "pysbd>=0.3.4",
    "nervaluate>=0.2.0",
    "transformers",  # tokenizers only; does not pull torch
]

[project.optional-dependencies]
torch = ["torch==2.10.0"]
ner = [
    "lab[torch]",
    "datasets>=5.0.0",
    "pytorch-crf>=0.7.2",
    "accelerate>=1.14.0",  # required by transformers Trainer
    "ray[tune]>=2.56.1",
    "optuna>=4.9.0",  # required by ray.tune.search.optuna
    "codecarbon>=3.2.9",
    "nvidia-ml-py>=12.0.0",  # imported as pynvml; the pynvml distribution is deprecated
]
nel = [
    "lab[torch]",
    "scikit-learn>=1.3",
    "networkx>=3.1",
    "tqdm>=4.66",
    "sentence-transformers>=3.0",
    "faiss-gpu>=1.14.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "faiss-cpu>=1.14.3; sys_platform != 'linux' or platform_machine != 'x86_64'",
]
all = ["lab[ner,nel]"]

[project.scripts]
lab = "lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]
